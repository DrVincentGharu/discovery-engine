<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-powered discovery engine</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f5f3ee;font-family:Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 18px 48px}
h1{color:#F5C400;font-size:30px;margin:0 0 6px}
p.sub{margin:0 0 22px;color:#9a9a94}
textarea{width:100%;min-height:150px;background:#000;color:#f5f3ee;border:2px solid #F5C400;padding:12px;font:inherit;resize:vertical;border-radius:0}
button{background:#F5C400;color:#000;border:0;padding:11px 22px;font:700 15px Helvetica,Arial,sans-serif;cursor:pointer;margin-top:10px;border-radius:0}
button:disabled{opacity:.5;cursor:wait}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#F5C400;margin:30px 0 10px;border-bottom:1px solid #333;padding-bottom:6px}
.field{margin:0 0 12px}.field b{display:block;font-size:12px;color:#F5C400;text-transform:uppercase;letter-spacing:.08em}
.tag{display:inline-block;background:#F5C400;color:#000;font-weight:700;padding:2px 8px;font-size:13px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row .n{width:34px;text-align:right;font-weight:700;color:#F5C400;font-size:20px}
.row .l{flex:0 0 250px;max-width:50%}
.bar{flex:1;height:10px;background:#1a1a1a}.bar i{display:block;height:100%;background:#F5C400}
.item{border-left:3px solid #F5C400;padding:2px 0 2px 10px;margin:10px 0;font-size:14px}
.item small{color:#9a9a94;display:block}
.note{color:#9a9a94;font-size:13px;margin:6px 0 0}
.err{color:#ff7a59}
@media(max-width:520px){.row{flex-wrap:wrap}.row .l{flex-basis:100%;max-width:100%}.bar{flex-basis:100%}}
</style></head><body><main>
<h1>AI-powered discovery engine</h1>
<p class="sub">Paste a real public conversation about someone struggling to find a photo. AI extracts what happened and files it into one of four problem clusters.</p>
<textarea id="t" placeholder="Paste a public post from Reddit, App Store, Google Play or the Google Photos Community…"></textarea>
<p class="note">Paste public posts only. Don't include private information.</p>
<button id="go">Analyze</button>
<div id="msg" class="note"></div>
<div id="res"></div>
<h2>Cluster tally (all visitors)</h2>
<div id="tally"></div>
<h2>Recent submissions</h2>
<div id="recent"><p class="note">Loading…</p></div>
</main>
<script>
var CL=["AI search overrides exact matching","Known text or details aren't indexed","Media format bypasses indexing","Backend sync or index failures"];
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function render(st){
  var c=CL.map(function(l){return st.counts[l]||0}),m=Math.max.apply(null,c.concat([1]));
  document.getElementById('tally').innerHTML=CL.map(function(l,i){return '<div class="row"><span class="n">'+c[i]+'</span><span class="l">'+(i+1)+'. '+esc(l)+'</span><span class="bar"><i style="width:'+(c[i]/m*100)+'%"></i></span></div>'}).join('');
  document.getElementById('recent').innerHTML=st.recent.length?st.recent.map(function(x){return '<div class="item"><span class="tag">'+esc(x.cluster)+'</span><br>'+esc(x.went_wrong)+'<small>'+new Date(x.created_at).toLocaleDateString()+'</small></div>'}).join(''):'<p class="note">No submissions yet — be the first.</p>';
}
async function load(){
  try{var r=await fetch('/api/stats');if(!r.ok)throw 0;render(await r.json())}
  catch(e){document.getElementById('recent').innerHTML='<p class="note err">Could not load the shared tally.</p>'}
}
function showRes(o){
  var f=[["What they remembered",o.remembered],["What they searched or tried",o.tried],["What went wrong",o.wentWrong],["Their workaround",o.workaround]];
  document.getElementById('res').innerHTML='<h2>Result</h2><p><span class="tag">'+esc(o.cluster)+'</span></p>'+f.map(function(x){return '<div class="field"><b>'+x[0]+'</b>'+esc(x[1])+'</div>'}).join('');
}
document.getElementById('go').onclick=async function(){
  var b=this,msg=document.getElementById('msg'),txt=document.getElementById('t').value.trim();
  if(txt.length<20){msg.className='note err';msg.textContent='Paste a longer conversation first.';return}
  b.disabled=true;msg.className='note';msg.textContent='Analyzing…';
  try{
    var r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});
    var j=await r.json();
    if(!r.ok){msg.className='note err';msg.textContent=j.error||'Something went wrong.'}
    else{msg.textContent='';showRes(j);load()}
  }catch(e){msg.className='note err';msg.textContent='Network error. Please try again.'}
  b.disabled=false;
};
load();
</script></body></html>
